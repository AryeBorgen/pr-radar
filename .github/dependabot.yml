version: 2

updates:
  # The action versions in .github/workflows are pinned to commit SHAs, which is
  # what stops a moved tag from changing what runs. The cost of pinning is that
  # nothing updates on its own, so Dependabot is what keeps the pins current --
  # it rewrites both the SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    groups:
      # One pull request for the routine bumps.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      # Majors normally deserve separate pull requests, because they are the
      # ones that need reading rather than merging. The build toolchain is the
      # exception: vite, its React plugin and its Tailwind plugin gate each
      # other on peer ranges, so a major for any one of them alone cannot even
      # install. Raised separately, all three pull requests fail at `npm ci` and
      # none of them says why. Grouped, the bump is testable.
      build-toolchain:
        patterns: ['vite', '@vitejs/*', '@tailwindcss/vite', 'tailwindcss', 'vitest']
        update-types: [major]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'docker'
