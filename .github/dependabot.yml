version: 2

updates:
  # The action versions in .github/workflows are pinned to commit SHAs, which is
  # what stops a moved tag from changing what runs. The cost of pinning is that
  # nothing updates on its own, so Dependabot is what keeps the pins current --
  # it rewrites both the SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    # One pull request for the routine bumps, separate ones for majors, which
    # are the only ones that need reading rather than merging.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'docker'
