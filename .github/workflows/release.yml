name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is published before the same checks a pull request would face have
  # passed against the exact commit being tagged. `prepublishOnly` runs them
  # again inside `npm publish`, but by then the tag exists and a failure is
  # already public; failing here costs nothing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody asked
      # for and cannot be taken back -- npm forbids reusing a version number.
      - name: Tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:lib
      - run: scripts/cli-smoke.sh

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs a provenance statement linking the published tarball to this
      # workflow and this commit, so anyone can check where it was built.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:lib

      # Node 24 above is not incidental. Trusted publishing needs npm 11.5.1 or
      # newer, and Node 22 bundles npm 10.9.8 -- which predates it, never
      # attempts OIDC, and sends an unauthenticated request instead. npm answers
      # that with `404 Not Found` on the PUT rather than a 401, so the failure
      # reads as "the package does not exist" and says nothing about auth at all.
      #
      # No credential is stored for this. npm accepts the workflow's own OIDC
      # identity through trusted publishing, which is why the job has
      # `id-token: write` above and no `NODE_AUTH_TOKEN` below, and why
      # provenance is attached without the flag being passed.
      #
      # npm's own token screen says it plainly: a token that bypasses 2FA -- and
      # one has to, since no CI can answer a 2FA prompt -- carries security
      # risks, and automation should use trusted publishing instead. So this
      # repository stores nothing.
      #
      # The cost is that trusted publishing is configured on a package's page at
      # npmjs.com, and there is no page until the package exists. Version 0.1.0
      # was therefore published by hand, from a laptop, against a real 2FA
      # prompt. Every release after it comes through here. See SECURITY.md.
      # Fail here, with the actual reason, rather than downstream with npm's
      # `404 Not Found` -- which is what an npm too old to attempt OIDC produces
      # and which blames a missing package for a missing credential.
      - name: npm must be new enough for trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have cannot use trusted publishing; $need or newer is required. Raise node-version in this workflow."
            exit 1
          fi
          echo "npm $have, trusted publishing available"

      - run: npm publish --access public

      # A publish that reports success and lands nothing, or lands without the
      # attestation, is the failure this whole arrangement exists to avoid. Ask
      # the registry rather than trusting the exit code.
      - name: The registry must actually have it, with provenance
        run: |
          version=$(node -p 'require("./package.json").version')
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sf "https://registry.npmjs.org/pr-radar/$version") && break
            echo "not visible yet, retrying"
            sleep 10
          done
          if [ -z "$body" ]; then
            echo "::error::pr-radar@$version is not on the registry after a successful publish"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"attestations"'; then
            echo "pr-radar@$version is live and carries a provenance attestation"
          else
            echo "::error::pr-radar@$version published without provenance. Trusted publishing attaches it automatically, so this means the publish did not go through OIDC."
            exit 1
          fi

  release:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # --generate-notes diffs against the previous release. Without one it lists
      # every pull request the project has ever merged, which is what v0.1.1's
      # notes did -- forty commits of history presented as the contents of a
      # patch release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # By version, not by creation date. `gh release list --limit 1` returns
          # the most recently *created* release, and those can arrive out of
          # order: v0.1.0's release was cut after v0.1.1's, so that query
          # answered "v0.1.0" and the next release's notes would have diffed
          # against it -- re-listing everything v0.1.1 already shipped.
          previous=$(git tag --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -1)
          # And say outright which release is current, for the same reason:
          # left to decide for itself, GitHub marked v0.1.0 latest over v0.1.1.
          if [ -n "$previous" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest \
              --generate-notes --notes-start-tag "$previous"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest --generate-notes
          fi

      # The release exists and the package is published; make sure they agree
      # before the job goes green.
      - name: Versions must agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-releases.sh

      # Everything before this tested a build. This installs what the registry
      # now serves and mounts it in a browser from a page with no bundler, which
      # is the only thing that would have caught the library's first release
      # referencing `process.env.NODE_ENV` -- a Node global that throws in a
      # page, invisible to the compiler, the types and the bundle alike.
      - name: The published package must actually work
        run: npx playwright install --with-deps chromium && scripts/published-smoke.sh "${GITHUB_REF_NAME#v}"
