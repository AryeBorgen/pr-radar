name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is published before the same checks a pull request would face have
  # passed against the exact commit being tagged. `prepublishOnly` runs them
  # again inside `npm publish`, but by then the tag exists and a failure is
  # already public; failing here costs nothing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody asked
      # for and cannot be taken back -- npm forbids reusing a version number.
      - name: Tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: scripts/cli-smoke.sh

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs a provenance statement linking the published tarball to this
      # workflow and this commit, so anyone can check where it was built.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Two ways in, and the first one that works wins.
      #
      # Trusted publishing is the one to end up on: npm accepts the workflow's
      # OIDC identity directly, so there is no long-lived credential in this
      # repository at all, and provenance is attached without asking. It has to
      # be enabled on the package's own page at npmjs.com, which means it cannot
      # be used for a package's first publish -- there is no page yet.
      #
      # So NPM_TOKEN carries the first release and nothing after it. Once the
      # package exists and its trusted publisher is configured, delete the secret
      # and revoke the token: the npm CLI prefers OIDC whenever it is available,
      # so this step keeps working with nothing set.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Say which credential was used
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::Published with NPM_TOKEN. Configure a trusted publisher for this package at npmjs.com, then delete the NPM_TOKEN secret and revoke the token -- this workflow keeps working without it."
          else
            echo "Published through trusted publishing. No stored credential was used."
          fi

  release:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
