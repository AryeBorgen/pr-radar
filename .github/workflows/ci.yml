name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. Stating that explicitly means a compromised
# dependency in the build cannot reach for a token that would let it push.
permissions:
  contents: read

# A superseded run is wasted minutes and a confusing status; let a newer push
# cancel it. Never on main, where every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:lib
      # A library compiles fine and is still unusable once installed: the
      # emitted .d.ts imported `./types` with no extension and a stylesheet,
      # neither of which a consumer can resolve, and neither of which `tsc -b`
      # or the bundler complains about. These two check the artifact.
      - run: npm run test:package
      - run: npm run test:types
      # `npx pr-radar` is a documented install path, so it gets checked like
      # one: packed, installed from the tarball and talked to over HTTP.
      - run: scripts/cli-smoke.sh

  # Unit tests cannot see a Content-Security-Policy that silently drops a
  # stylesheet, an <img src=""> React warns about, or an API that stops
  # answering a cross-origin request. A browser can, and all three have
  # actually happened here.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # tests/surface.spec.ts and tests/embed.spec.ts run against the built
      # library, not the source.
      - run: npm run build:lib
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Pinning to SHAs only helps if every workflow actually does it, and that is
  # the kind of rule a hurried edit breaks silently. Check it mechanically.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint-workflows.sh
      # A version on npm with no tag, or a tag with no release, breaks nothing --
      # which is exactly why it goes unnoticed. 0.1.0 sat on the registry for
      # hours with neither.
      - run: scripts/check-releases.sh
        env:
          GH_TOKEN: ${{ github.token }}
