name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches rules added after a pull request was merged. Off-peak
    # on a Monday so a finding is waiting at the start of the week.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          # The default suite misses whole classes of finding; this one includes
          # the quality and extended-security rules as well.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:javascript-typescript
