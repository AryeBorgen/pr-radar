name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the build sign a provenance attestation, so a puller can verify the
      # image came from this workflow at this commit rather than from someone's
      # laptop with a valid token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner is amd64; arm64 is emulated. Without this the published image
      # is amd64-only, and every Apple Silicon, Graviton or Pi host either runs
      # it under emulation or cannot run it at all.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Pull requests build the image but do not publish it, so a broken
      # Dockerfile fails review rather than after merge.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # What went into the image, and where it came from, recorded with it.
          provenance: mode=max
          sbom: true

      # build-push-action does not load the image into the local daemon, so the
      # smoke test builds its own copy; the layers are already cached.
      - name: Check the image actually serves the app
        run: |
          docker build -t pr-radar:ci .
          docker/smoke.sh pr-radar:ci

      # --wait blocks until every service reports healthy, which is the whole
      # point -- but its default timeout is none at all, so a container that
      # never goes healthy would hold the job open until the job limit rather
      # than failing. The bound is what turns a hang into a red build.
      - name: Check docker-compose builds and serves
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl -sf http://localhost:4173/ | grep -q "PR Radar"
      - name: Tear down compose
        if: always()
        run: docker compose down --remove-orphans
