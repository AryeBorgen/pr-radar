name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the build sign a provenance attestation, so a puller can verify the
      # image came from this workflow at this commit rather than from someone's
      # laptop with a valid token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner is amd64; arm64 is emulated. Without this the published image
      # is amd64-only, and every Apple Silicon, Graviton or Pi host either runs
      # it under emulation or cannot run it at all.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pull requests build the image but do not publish it, so a broken
      # Dockerfile fails review rather than after merge.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # What went into the image, and where it came from, recorded with it.
          provenance: mode=max
          sbom: true

      # `provenance: mode=max` above records how the image was built and attaches
      # that to the image itself, readable with
      # `docker buildx imagetools inspect --format '{{json .Provenance}}'`.
      # It is not the same thing as a GitHub attestation, which lives in this
      # repository and is what `gh attestation verify` looks for. SECURITY.md
      # documented the second while the workflow produced only the first, so the
      # command it told people to run returned a 404. This step produces the
      # second as well.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # build-push-action does not load the image into the local daemon, so the
      # smoke test builds its own copy; the layers are already cached.
      - name: Check the image actually serves the app
        run: |
          docker build -t pr-radar:ci .
          docker/smoke.sh pr-radar:ci

      # --wait blocks until every service reports healthy, which is the whole
      # point -- but its default timeout is none at all, so a container that
      # never goes healthy would hold the job open until the job limit rather
      # than failing. The bound is what turns a hang into a red build.
      - name: Check docker-compose builds and serves
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl -sf http://localhost:4173/ | grep -q "PR Radar"
      - name: Tear down compose
        if: always()
        run: docker compose down --remove-orphans
