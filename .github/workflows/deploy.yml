name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded deploy is pointless work; let a newer push cancel it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site from /<repo>/, so assets need that prefix.
          PR_RADAR_BASE: /${{ github.event.repository.name }}/
          # Where sign-in is relayed. Pages has no server of its own, so without
          # this the page asks its own origin, gets the 404 that a static host
          # correctly gives, and shows the token field alone.
          #
          # Setting it does two things and both are required: the page asks that
          # origin, and the build adds it to `connect-src`. Miss the second and
          # the browser blocks the request with no error the page can see, which
          # looks exactly like the relay being down.
          PR_RADAR_RELAY: https://pr-radar-auth.aryeborgen.workers.dev
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # v5, not v3. The repository requires every action to be pinned to a SHA,
      # and that requirement reaches nested actions: v3 of this one calls
      # `actions/upload-artifact@v4` by tag internally, so the deploy was
      # refused before it ran. v5 pins its own dependency.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The app holds a live GitHub token, so a visitor arriving over plain HTTP
      # must be redirected rather than served a page whose script anyone on the
      # path could rewrite. Pages will not accept the setting until it has
      # finished issuing the certificate, which can lag a day behind the site
      # actually working -- so ask on every deploy and shrug if it is too early.
      # The next deploy turns it on rather than a person having to remember.
      - name: Ask Pages to enforce HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -F https_enforced=true \
            && echo "HTTPS enforcement is on" \
            || echo "::warning::Pages would not enable HTTPS enforcement yet (certificate still issuing). The next deploy will try again."

  # A deploy that goes green while serving a blank page is the failure mode that
  # matters here, and it has happened: the site once answered 200 with the
  # unbuilt source because Pages was building from the branch rather than from
  # this workflow. Fetch the deployed page and check what is actually in it.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/site-smoke.sh "${{ needs.deploy.outputs.page_url }}"
