name: Bug report
description: Something behaves differently from how it reads.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not paste a GitHub token, or a
        screenshot with one visible, anywhere in this form.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I selected Who: Mine and State: Approved, and ...
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - The hosted site
        - Installed to a home screen
        - Docker
        - npx / npm start
        - From source (npm run dev)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 on Android 15
    validations:
      required: true

  - type: textarea
    id: filter
    attributes:
      label: The filter, if one was active
      description: Copy the contents of the filter box. Redact repository names if you need to.
      render: text

  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console
      description: Errors and warnings, if any. Check for a token before pasting.
      render: text
