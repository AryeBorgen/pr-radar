# A blank issue is the door around every check below it: two words filed only to
# satisfy the rule that a pull request needs one. The forms are short, and there
# is a link for questions.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/AryeBorgen/pr-radar/security/advisories/new
    about: Report privately here instead. Please do not open a public issue for anything exploitable.
  - name: How do I get a token?
    url: https://github.com/AryeBorgen/pr-radar#start-here
    about: Three steps in the README, and public repositories need no scopes at all.
