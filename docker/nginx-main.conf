# The main nginx configuration, replacing the image's own.
#
# It exists for one line -- `load_module` -- which nginx accepts only at the top
# level, above the http block the stock config already opened. Everything else
# here is the stock file, so keep it that way: this is a place to add a module,
# not a place to tune a server.
load_module modules/ngx_http_js_module.so;

# nginx hands its worker processes only TZ unless a variable is named here, so
# without these two the relay sees an empty client id no matter how the
# container is run -- and answers "no GitHub App configured" to a container that
# has one. Found by the conformance suite, which asked both servers the same
# question and got different answers.
env PR_RADAR_CLIENT_ID;
env PR_RADAR_UPSTREAM;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;

  # The JavaScript relay. `js_path` is where both files live: the nginx adapter
  # and the policy it shares with bin/pr-radar.js.
  js_path /etc/nginx/njs/;
  js_import relay from relay.js;

  # ngx.fetch needs to resolve github.com, and needs to trust it. Without the
  # certificate bundle the handshake fails with "unable to get local issuer
  # certificate" and the relay answers 502 -- found by running it, not by
  # reading about it.
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;
  js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  include /etc/nginx/conf.d/*.conf;
}
