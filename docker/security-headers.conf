# nginx does not merge add_header across levels: a location that defines one of
# its own drops everything inherited from the server block. Both locations set
# Cache-Control, so these have to be included in each of them rather than stated
# once above.

# frame-ancestors is the one directive a <meta> tag cannot carry, and it is the
# one that stops this page being framed by a site that wants your keystrokes.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# Without this a browser may decide a response is a script because it looks like
# one, whatever the Content-Type says.
add_header X-Content-Type-Options "nosniff" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, a location or a payment handler. Saying so means
# an injected script cannot ask for them either.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
