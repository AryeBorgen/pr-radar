server {
  # Both families. `listen 80` alone binds IPv4 only -- that is what the stock
  # nginx default.conf does -- which leaves the container unreachable to any
  # client that resolves its name to an AAAA record first. Binding :: is safe
  # even where IPv6 is switched off: the socket family still exists, so nginx
  # starts either way.
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;

  # Not in nginx's mime.types, so without this the manifest is served as
  # application/octet-stream and a browser is entitled to ignore it -- which
  # costs the install prompt with no error anywhere.
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Signing in with a GitHub account. github.com/login/* sends no
  # Access-Control-Allow-Origin, so a page cannot read its replies -- measured
  # on every run in tests/reachability.spec.ts -- and a relay is the only way.
  # The rules live in relay-policy.js, which `npx pr-radar` runs too.
  #
  # Declared before /assets/ and / so a missing auth route answers 404 as JSON
  # rather than falling through to index.html, which would make a fetch report a
  # parse error instead of a missing route.
  location = /auth/config {
    js_content relay.config;
  }
  location = /auth/device/code {
    client_max_body_size 64k;
    js_content relay.device;
  }
  location = /auth/device/token {
    client_max_body_size 64k;
    js_content relay.device;
  }
  # Anything else under /auth/ is not a route here, and must say so in the same
  # language as the routes that are.
  location /auth/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"not_found"}';
  }

  # Asset filenames carry a content hash, so they can be cached forever.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or a redeploy keeps serving the old app.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
