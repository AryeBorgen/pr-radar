<svg viewBox="144.78 -22.98 376.98 540.98" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">מסקוט PR Radar</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">דמות רובר מקורית: ראש שהוא צלחת לוויין רחבה מוטה בכ-17 מעלות, עם סהר כהה לאורך השפה התחתונה, שתי עיניים עגולות נמוכות עם נצנוץ לבן, אנטנה עבה היוצאת ממרכז הצלחת ניצבת לציר הארוך שלה — כלפי מעלה-שמאלה — ומסתיימת בנקודה מלאה על השפה, ושתי קשתות מנטה סביבה. מתחת: צוואר קצר, גוף מעוגל צר מהצלחת, שתי זרועות עבות נמוכות ושתי רגליים קטנות. בלי צל קרקע.</desc>
